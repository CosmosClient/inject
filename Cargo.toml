[package]
name = "cosmos-inject"
version = "0.1.0"
edition = "2024"
description = "Inject a dynamic library into a running process on macOS and Windows"
repository = "https://github.com/cosmosclient/inject"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Reads the __text section out of the assembled shellcode object. Used only
# to generate the shellcode byte arrays (see build.rs).
object = { version = "0.36", default-features = false, features = ["read_core", "macho", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory"] }
